<!doctype html>

<title>Sid card responsive QC</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;background:#59544e;font:13px system-ui,sans-serif;color:#fff}
  header{height:42px;display:flex;align-items:center;justify-content:center;background:#211a15;letter-spacing:.08em}
  main{padding:20px;display:flex;justify-content:center}
  iframe{display:block;border:0;background:#2a170e;box-shadow:0 18px 60px #0009}

<header id="label"></header><main><iframe id="frame" src="sids-card.html#cv-real"></iframe></main>
<script>

</script>
