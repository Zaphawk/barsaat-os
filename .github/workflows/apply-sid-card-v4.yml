name: Apply Sid card v4
on:
  push:
    paths:
      - '.github/workflows/apply-sid-card-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified Sid card v4 delta
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/sid-card-v4.zst
          zstd -d --patch-from=sids-card.html /tmp/sid-card-v4.zst -o /tmp/sids-card-v4.html
          mv /tmp/sids-card-v4.html sids-card.html
          git rm '.github/workflows/apply-sid-card-v4.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sids-card.html
          git commit -m 'Update Sid card to v4 capability narrative'
          git push
