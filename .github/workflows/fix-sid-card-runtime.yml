name: Fix Sid card runtime
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-sid-card-runtime.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified runtime patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/sid-fix.zst
          zstd --patch-from=sids-card.html /tmp/sid-fix.zst -o /tmp/sids-card.fixed.html
          mv /tmp/sids-card.fixed.html sids-card.html
          rm .github/workflows/fix-sid-card-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sids-card.html .github/workflows/fix-sid-card-runtime.yml
          git commit -m "Fix Sid card runtime rendering"
          git push
