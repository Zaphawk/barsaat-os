name: Fix final-stage overlap
on:
  push:
    paths:
      - .github/workflows/fix-final-overlap.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified overlap fix
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/qc-fix.zst
          zstd -d --patch-from=sids-card.html /tmp/qc-fix.zst -o /tmp/sids-card.fixed.html
          mv /tmp/sids-card.fixed.html sids-card.html
          rm .github/workflows/fix-final-overlap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sids-card.html .github/workflows/fix-final-overlap.yml
          git commit -m "Fix progress bar overlap on final card stage"
          git push
